[project]
name = "uganda_compliance"
authors = [
    { name = "ERP Champions Ltd", email = "moki@erpchampions.com"}
]
description = "ERPNext Tax Compliance with Uganda"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pycryptodome==3.21.0",
    "pyopenssl==25.3.0",
    "qrcode~=7.4.2",
    "PyQRCode==1.2.1",
    "pillow==12.0.0",
    "pypng==0.20220715.0",
    "numpy==2.2.4"

]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff.lint]
ignore = ["F401", "F841"]